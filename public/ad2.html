<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #f4f4f5;
            overflow: hidden; 
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .placeholder {
            position: absolute;
            color: #a1a1aa;
            font-family: sans-serif;
            font-size: 12px;
            z-index: -1;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #27272a; }
            .placeholder { color: #52525b; }
        }
    </style>
</head>
<body>
    <div class="placeholder">Loading Advertisement...</div>
    <script>
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            var s = document.createElement('script');
            s.settings = {};
            s.src = "//second-director.com/cmD.9z6qb-2C5/l/StWNQ-9KN/zjMV5ONLzYY/y/O/ST0/3JMSz/kY3zN/jQMAzz";
            s.async = true;
            s.referrerPolicy = 'no-referrer-when-downgrade';
            document.body.appendChild(s);
        } else {
            document.body.innerHTML = '<span style="color: #999; font-family: sans-serif; font-size: 12px;">Advertisement (Dev)</span>';
        }
    </script>
</body>
</html>
